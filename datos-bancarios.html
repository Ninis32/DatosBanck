<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Datos para transferir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#EEF2F0;--card:#fff;--ink:#12261F;--muted:#5B6B65;--line:#D5DDD9;--accent:#0B6B52;--accent-ink:#fff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.5}
  main{max-width:480px;margin:0 auto;padding:28px 18px 48px}
  h1{font-size:1.9rem;line-height:1.1;margin:0 0 6px;font-weight:800}
  .sub{color:var(--muted);margin:0 0 22px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .lbl{font-size:.82rem;color:var(--muted)}
  .val{font-weight:600;font-size:1.05rem;word-break:break-all}
  .mini{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:7px 12px;font:inherit;font-size:.9rem;cursor:pointer;flex:none}
  .mini:hover{border-color:var(--accent)}
  .actions{display:grid;gap:10px;margin-top:18px}
  .btn{display:block;width:100%;padding:15px;border-radius:12px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600;font-size:1rem;text-align:center;text-decoration:none;cursor:pointer}
  .btn.alt{background:transparent;color:var(--accent)}
  .btn:focus-visible,.mini:focus-visible{outline:3px solid #7FD1B5;outline-offset:2px}
  #msg{min-height:1.4em;text-align:center;color:var(--accent);font-weight:600;margin:14px 0 0}
  details{margin-top:28px;color:var(--muted);font-size:.9rem}
  summary{cursor:pointer}
  #qr{margin:14px 0;display:inline-block;padding:12px;background:#fff;border:1px solid var(--line);border-radius:12px}
</style>
</head>
<body>
<main>
  <h1 id="titulo"></h1>
  <p class="sub">Guarda estos datos una vez y transfiere cuando quieras, sin escribir nada.</p>

  <div class="card" id="datos"></div>

  <div class="actions">
    <button class="btn" id="copiar">Copiar todos los datos</button>
    <a class="btn alt" id="wa" target="_blank" rel="noopener">Guardar en mi WhatsApp</a>
    <button class="btn alt" id="vcf">Guardar como contacto</button>
  </div>
  <p id="msg" role="status" aria-live="polite"></p>

  <details>
    <summary>Para el titular: obtener el QR de esta página</summary>
    <div id="qr"></div><br>
    <button class="mini" id="dl">Descargar QR</button>
  </details>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ====== EDITA SOLO ESTA SECCIÓN ====== */
const CONFIG = {
  titular: "Ninoska Burgos",
  rut: "16.720.588-7",
  banco: "BancoEstado",
  tipoCuenta: "Cuenta RUT",
  numeroCuenta: "16720588",
  email: "",                        // opcional
  whatsapp: ""                      // opcional: ej. 56912345678 (con código de país, sin + ni espacios)
};
/* ====================================== */

const campos = [
  ["Titular", CONFIG.titular],
  ["RUT", CONFIG.rut],
  ["Banco", CONFIG.banco],
  ["Tipo de cuenta", CONFIG.tipoCuenta],
  ["N° de cuenta", CONFIG.numeroCuenta],
  ["Correo", CONFIG.email]
].filter(c => c[1]);

const texto = "Datos para transferir\n" + campos.map(c => c[0] + ": " + c[1]).join("\n");
const $ = id => document.getElementById(id);
const msg = t => { $("msg").textContent = t; clearTimeout(msg.t); msg.t = setTimeout(() => $("msg").textContent = "", 2500); };

async function copiar(t, ok) {
  try { await navigator.clipboard.writeText(t); }
  catch (e) {
    const a = document.createElement("textarea"); a.value = t; document.body.appendChild(a);
    a.select(); document.execCommand("copy"); a.remove();
  }
  msg(ok);
}

$("titulo").textContent = CONFIG.titular;
document.title = "Datos para transferir a " + CONFIG.titular;

campos.forEach(([l, v]) => {
  const r = document.createElement("div"); r.className = "row";
  r.innerHTML = '<div><div class="lbl"></div><div class="val"></div></div>';
  r.querySelector(".lbl").textContent = l;
  r.querySelector(".val").textContent = v;
  const b = document.createElement("button"); b.className = "mini"; b.textContent = "Copiar";
  b.setAttribute("aria-label", "Copiar " + l);
  b.onclick = () => copiar(v, l + " copiado");
  r.appendChild(b); $("datos").appendChild(r);
});

$("copiar").onclick = () => copiar(texto, "Datos copiados");

/* WhatsApp: abre el chat contigo mismo con los datos listos para guardar/enviar */
$("wa").href = "https://wa.me/" + CONFIG.whatsapp.replace(/\D/g, "") + "?text=" + encodeURIComponent(texto);
$("wa").textContent = CONFIG.whatsapp ? "Enviarme los datos por WhatsApp" : "Guardar en WhatsApp";

/* Contacto (.vcf): el cliente lo abre y los datos quedan en la agenda */
$("vcf").onclick = () => {
  const esc = s => String(s).replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/,/g, "\\,").replace(/;/g, "\\;");
  const v = ["BEGIN:VCARD", "VERSION:3.0",
    "FN:" + esc(CONFIG.titular + " (cuenta)"),
    "ORG:" + esc(CONFIG.banco),
    CONFIG.whatsapp ? "TEL;TYPE=CELL:+" + CONFIG.whatsapp.replace(/\D/g, "") : "",
    CONFIG.email ? "EMAIL:" + esc(CONFIG.email) : "",
    "NOTE:" + esc(texto),
    "END:VCARD"].filter(Boolean).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([v], { type: "text/vcard" }));
  a.download = "datos-bancarios.vcf"; document.body.appendChild(a); a.click(); a.remove();
  msg("Contacto descargado: ábrelo para guardarlo");
};

/* QR de esta misma página */
try {
  new QRCode($("qr"), { text: location.href.split("#")[0], width: 200, height: 200, correctLevel: QRCode.CorrectLevel.M });
  $("dl").onclick = () => {
    const c = $("qr").querySelector("canvas"); const a = document.createElement("a");
    a.href = c ? c.toDataURL("image/png") : $("qr").querySelector("img").src;
    a.download = "qr-datos-bancarios.png"; a.click();
  };
} catch (e) { $("qr").textContent = "No se pudo generar el QR."; }
</script>
</body>
</html>
