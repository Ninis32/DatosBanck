<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elige la cuenta para transferir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#EEF2F0;--card:#fff;--ink:#12261F;--muted:#5B6B65;--line:#D5DDD9;--accent:#0B6B52}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.5}
  main{max-width:480px;margin:0 auto;padding:28px 18px 48px}
  h1{font-size:1.9rem;line-height:1.1;margin:0 0 6px;font-weight:800}
  .sub{color:var(--muted);margin:0 0 22px}
  .list{display:grid;gap:10px}
  a.cuenta{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-decoration:none;color:var(--ink)}
  a.cuenta:hover{border-color:var(--accent)}
  a.cuenta:focus-visible{outline:3px solid #7FD1B5;outline-offset:2px}
  .nom{font-weight:800;font-size:1.15rem}
  .det{color:var(--muted);font-size:.92rem}
  details{margin-top:28px;color:var(--muted);font-size:.9rem}
  summary{cursor:pointer}
  #qr{margin:14px 0;display:inline-block;padding:12px;background:#fff;border:1px solid var(--line);border-radius:12px}
  .mini{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:7px 12px;font:inherit;font-size:.9rem;cursor:pointer}
</style>
</head>
<body>
<main>
  <h1>¿A qué cuenta quieres transferir?</h1>
  <p class="sub">Toca una cuenta para ver y copiar sus datos.</p>

  <div class="list">
    <a class="cuenta" href="datos-bancarios.html">
      <div class="nom">Ninoska Burgos</div>
      <div class="det">BancoEstado · Cuenta RUT</div>
    </a>
    <a class="cuenta" href="datos-bancarios-falabella.html">
      <div class="nom">Ninoska Burgos</div>
      <div class="det">Banco Falabella · Cuenta corriente</div>
    </a>
    <a class="cuenta" href="datos-bancarios-felipe.html">
      <div class="nom">Felipe Melendez</div>
      <div class="det">BancoEstado · Cuenta RUT</div>
    </a>
  </div>

  <details>
    <summary>Para el titular: obtener el QR de esta página</summary>
    <div id="qr"></div><br>
    <button class="mini" id="dl">Descargar QR</button>
  </details>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
try {
  new QRCode(document.getElementById("qr"), { text: location.href.split("#")[0], width: 200, height: 200, correctLevel: QRCode.CorrectLevel.M });
  document.getElementById("dl").onclick = () => {
    const q = document.getElementById("qr"), c = q.querySelector("canvas"), a = document.createElement("a");
    a.href = c ? c.toDataURL("image/png") : q.querySelector("img").src;
    a.download = "qr-cuentas.png"; a.click();
  };
} catch (e) { document.getElementById("qr").textContent = "No se pudo generar el QR."; }
</script>
</body>
</html>
